<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>utilitye2e-ai</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div id="app">
    <header>
        <h1>🤖 utilitye2e-ai</h1>
        <button id="btn-logout" class="btn-logout" title="關閉伺服器">⏻ 登出</button>
    </header>

    <main>
        <!-- Step 1: Describe -->
        <section id="step-describe" class="card">
            <!-- Target URL -->
            <div class="flow-question">
                <label>Target URL</label>
                <input id="txt-url" class="flow-input" placeholder="https://tutor.classtutorbot.com/t/ctb-premium-demo/ctb/parents">
            </div>

            <!-- Auth (collapsible) -->
            <details class="auth-details">
                <summary>登入設定</summary>
                <div class="auth-grid">
                    <div><label>Login URL</label><input id="txt-login-url" placeholder="https://tutor.classtutorbot.com/t/ctb-premium-demo/login"></div>
                    <div><label>Username</label><input id="txt-username" placeholder="admin"></div>
                    <div><label>Password</label><input id="txt-password" type="password" placeholder="••••"></div>
                </div>
            </details>

            <div class="flow-merge">↓</div>

            <!-- Discover -->
            <div class="flow-question">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                    <button id="btn-discover" class="btn-secondary">🔍 探索元件</button>
                    <span id="discover-status" style="font-size:.8rem;color:#64748b"></span>
                </div>
                <div id="discover-results" class="discover-list hidden"></div>
            </div>

            <div class="flow-merge">↓</div>

            <!-- Question box -->
            <div class="flow-question">
                <label>描述你想測試什麼</label>
                <textarea id="txt-description" rows="3" placeholder="例: 測試家長管理的新增、編輯、刪除功能"></textarea>
            </div>

            <div class="flow-merge">↓</div>

            <div class="flow-action-row">
                <button id="btn-analyze" class="btn-primary btn-large">🤖 AI 分析</button>
                <label class="auto-run-label"><input type="checkbox" id="chk-autorun"> 分析後自動執行</label>
            </div>
            <div id="analyze-error" class="error-msg hidden"></div>
        </section>

        <!-- Step 2: Review/Edit Steps -->
        <section id="step-spec" class="card hidden">
            <h2>Step 2 — 檢視/微調測試步驟</h2>
            <div class="row">
                <div class="col" style="flex:2"><label>Test Name</label><input id="sp-name"></div>
                <div class="col" style="flex:3"><label>Target URL</label><input id="sp-url"></div>
            </div>
            <h3>測試步驟</h3>
            <div id="steps-container"></div>
            <div class="row" style="margin-top:12px;gap:8px">
                <button id="btn-add-step" class="btn-secondary">+ 新增步驟</button>
                <button id="btn-run" class="btn-primary">▶ 執行測試</button>
                <button id="btn-save" class="btn-secondary">💾 存檔</button>
            </div>
        </section>

        <!-- Step 3: Results -->
        <section id="step-results" class="card hidden">
            <div class="section-header">
                <h2>Step 3 — 測試結果</h2>
                <div class="btn-group">
                    <button id="btn-clear-results" class="btn btn-secondary">清除</button>
                    <button id="btn-save-results" class="btn btn-primary">存檔</button>
                </div>
            </div>
            <div id="result-summary" class="summary-grid"></div>
            <div class="table-scroll">
                <table id="result-table">
                    <thead><tr><th></th><th>Test</th><th>Detail</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script src="/static/js/app.js"></script>
</body>
</html>
