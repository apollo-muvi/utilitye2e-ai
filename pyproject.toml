[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "utilitye2e-ai"
version = "0.1.0"
description = "Open-source E2E test generator: AI + DB schema → Playwright CRUD tests"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "playwright>=1.40.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
mysql = ["mysql-connector-python>=8.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
utilitye2e-ai = "cli:main"

[tool.setuptools.packages.find]
include = ["core*", "adapters*", "ai*", "web*"]

[tool.setuptools.package-data]
"web" = ["templates/*.html", "static/css/*.css", "static/js/*.js"]
